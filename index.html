<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lingo Check</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#14120F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===========================================================================
   LINGO CHECK — Mischpult
   Herleitung: Dies ist kein Formular, sondern ein Tonstudio. Zwei Sprach-
   varietäten = zwei Kanäle. Dunkel, weil hier stundenlang gearbeitet wird.
   Somali in Schreibmaschinenschrift, weil es das bearbeitete Material ist.
   Die eine Kühnheit: die echte Wellenform beim Aufnehmen.
   ========================================================================= */
:root{
  --grund:#14120F;        /* warmes Fast-Schwarz, braunstichig */
  --pult:#1D1A15;         /* Pultfläche */
  --pult2:#262119;        /* erhoben */
  --linie:#332D24;
  --schrift:#EFE9DE;      /* warmes Elfenbein */
  --schrift2:#A79E90;
  --schrift3:#6F675C;
  --maxaa:#4FB286;        /* Kanal 1 — Jade */
  --maay:#E0A458;         /* Kanal 2 — Ocker */
  --rec:#D64933;          /* Aufnahme, Studiokonvention */
  --papier:#F5F0E6;       /* Deutsch = die Quelle, hell wie ein Blatt */
  --tinte:#14120F;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;padding:0 0 116px;background:var(--grund);color:var(--schrift);
 font:16px/1.5 "IBM Plex Sans",-apple-system,BlinkMacSystemFont,sans-serif;
 background-image:
   radial-gradient(1000px 460px at 50% -14%,rgba(79,178,134,.055),transparent 60%),
   radial-gradient(760px 380px at 92% 8%,rgba(224,164,88,.05),transparent 60%);
 background-attachment:fixed}
body.gesperrt{overflow:hidden}
.mitte{width:100%;max-width:720px;margin:0 auto;padding:0 16px}
@keyframes hoch{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes recpuls{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes quittung{0%{border-color:var(--maxaa);box-shadow:0 0 0 1px var(--maxaa),0 0 34px rgba(79,178,134,.3)}100%{border-color:var(--linie);box-shadow:none}}

/* ---------- Anmeldung ---------- */
#tor{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
 padding:22px;background:var(--grund);
 background-image:radial-gradient(760px 460px at 50% 18%,rgba(79,178,134,.10),transparent 62%)}
.torkarte{width:100%;max-width:400px;animation:hoch .55s cubic-bezier(.2,.9,.2,1)}
.torlogo{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:26px}
.wortmarke{font:400 34px/1 "Instrument Serif",Georgia,serif;letter-spacing:.005em}
.wortmarke em{font-style:italic;color:var(--maxaa)}
.torkarte p.unter{text-align:center;color:var(--schrift3);font:500 12px "IBM Plex Mono",monospace;
 letter-spacing:.17em;text-transform:uppercase;margin:0 0 30px}
.torkarte label{display:block;font:500 11px "IBM Plex Mono",monospace;letter-spacing:.15em;
 text-transform:uppercase;color:var(--schrift3);margin:0 0 9px}
.torkarte input{width:100%;padding:15px 16px;border:1px solid var(--linie);border-radius:3px;
 font:500 17px "IBM Plex Mono",monospace;background:var(--pult);color:var(--schrift);transition:.18s}
.torkarte input:focus{outline:none;border-color:var(--maxaa);box-shadow:0 0 0 3px rgba(79,178,134,.16)}
.torbtn{width:100%;margin-top:16px;padding:16px;border:0;border-radius:3px;background:var(--maxaa);
 color:#0C1B14;font:700 14px "IBM Plex Mono",monospace;letter-spacing:.13em;text-transform:uppercase;
 cursor:pointer;transition:.16s}
.torbtn:hover{background:#5FC496} .torbtn:active{transform:translateY(1px)}
.torhinweis{margin:22px 0 0;font-size:13px;color:var(--schrift3);text-align:center;line-height:1.6}

/* ---------- Menü ---------- */
#schleier{position:fixed;inset:0;background:rgba(10,9,7,.66);z-index:60;opacity:0;
 pointer-events:none;transition:opacity .26s}
#schleier.auf{opacity:1;pointer-events:auto}
#menue{position:fixed;top:0;left:0;bottom:0;width:308px;max-width:87vw;z-index:70;background:var(--pult);
 border-right:1px solid var(--linie);transform:translateX(-100%);
 transition:transform .3s cubic-bezier(.2,.9,.2,1);display:flex;flex-direction:column}
#menue.auf{transform:none}
.menuekopf{padding:17px 16px;border-bottom:1px solid var(--linie);display:flex;
 align-items:center;justify-content:space-between}
.menuekopf h2{margin:0;font:400 22px "Instrument Serif",Georgia,serif}
.zu{width:34px;height:34px;border-radius:3px;border:1px solid var(--linie);background:transparent;
 color:var(--schrift2);font-size:16px;cursor:pointer}
.zu:hover{border-color:var(--maxaa);color:var(--maxaa)}
.menueinhalt{flex:1;overflow-y:auto;padding:14px 12px 26px}
.mtitel{font:500 10px "IBM Plex Mono",monospace;letter-spacing:.19em;text-transform:uppercase;
 color:var(--schrift3);margin:20px 0 8px 8px}
.mtitel:first-child{margin-top:2px}
.meintrag{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;
 padding:10px 12px;border:0;border-left:2px solid transparent;background:transparent;
 font:500 14px "IBM Plex Sans",sans-serif;color:var(--schrift2);cursor:pointer;text-align:left;transition:.14s}
.meintrag:hover{background:var(--pult2);color:var(--schrift)}
.meintrag.aktiv{background:var(--pult2);color:var(--schrift);border-left-color:var(--maxaa)}
.meintrag .anz{font:500 11px "IBM Plex Mono",monospace;color:var(--schrift3)}
.meintrag.aktiv .anz{color:var(--maxaa)}

/* ---------- Kopfleiste ---------- */
header{position:sticky;top:0;z-index:40;background:rgba(20,18,15,.93);
 backdrop-filter:blur(14px);border-bottom:1px solid var(--linie)}
.kopf{display:flex;align-items:center;gap:12px;padding:10px 0}
.burger{width:38px;height:38px;min-width:38px;border-radius:3px;border:1px solid var(--linie);
 background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;
 justify-content:center;gap:4px;transition:.15s}
.burger:hover{border-color:var(--maxaa)}
.burger span{width:15px;height:1.5px;background:var(--schrift2);border-radius:1px}
.burger:hover span{background:var(--maxaa)}
.kopfmarke{font:400 21px "Instrument Serif",Georgia,serif;flex:1;white-space:nowrap}
.kopfmarke em{font-style:italic;color:var(--maxaa)}
.mono{font:500 11px "IBM Plex Mono",monospace;letter-spacing:.09em;color:var(--schrift3);white-space:nowrap}
.mono b{color:var(--schrift);font-weight:600}
.sitzung{border:1px solid var(--linie);border-radius:3px;padding:4px 9px}
.ichchip{border:1px solid var(--linie);border-radius:3px;padding:4px 9px;cursor:pointer;
 color:var(--schrift2);background:transparent;font:500 11px "IBM Plex Mono",monospace}
.ichchip:hover{border-color:var(--maxaa);color:var(--maxaa)}
.spur{height:2px;background:var(--linie);position:relative;overflow:hidden}
.spur i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--maxaa),var(--maay));
 width:0;transition:width .9s cubic-bezier(.2,.9,.2,1)}
.suchreihe{display:flex;gap:9px;padding:11px 0 5px}
#suchfeld{flex:1;padding:10px 13px;border:1px solid var(--linie);border-radius:3px;
 font:500 14px "IBM Plex Mono",monospace;background:var(--pult);color:var(--schrift);transition:.16s}
#suchfeld:focus{outline:none;border-color:var(--maxaa);box-shadow:0 0 0 3px rgba(79,178,134,.14)}
#suchfeld::placeholder{color:var(--schrift3)}
#ladeinfo{font:500 11px "IBM Plex Mono",monospace;color:var(--schrift3);min-height:15px;padding-bottom:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:10px}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--maxaa);
 color:var(--maxaa);border-radius:3px;padding:4px 6px 4px 10px;
 font:500 11px "IBM Plex Mono",monospace;letter-spacing:.06em;text-transform:uppercase}
.chipx{width:16px;height:16px;border:0;background:transparent;color:inherit;font-size:13px;
 cursor:pointer;line-height:1;padding:0}

/* ---------- Karte ---------- */
#karte{border:1px solid var(--linie);background:var(--pult);border-radius:4px;
 animation:hoch .3s cubic-bezier(.2,.9,.2,1)}
#karte.quittiert{animation:quittung .8s ease}
.kartekopf{display:flex;justify-content:space-between;align-items:center;gap:9px;flex-wrap:wrap;
 padding:11px 16px;border-bottom:1px solid var(--linie);background:var(--grund)}
.pos{font:500 11px "IBM Plex Mono",monospace;letter-spacing:.12em;color:var(--schrift3)}
.pos b{color:var(--schrift)}
.marken{display:flex;gap:6px;flex-wrap:wrap}
.mk{font:600 9.5px "IBM Plex Mono",monospace;letter-spacing:.13em;text-transform:uppercase;
 padding:3px 8px;border-radius:2px;border:1px solid}
.mk.warn{color:var(--maay);border-color:rgba(224,164,88,.4);background:rgba(224,164,88,.09)}
.mk.ok{color:var(--maxaa);border-color:rgba(79,178,134,.4);background:rgba(79,178,134,.09)}
.mk.falsch{color:var(--rec);border-color:rgba(214,73,51,.4);background:rgba(214,73,51,.09)}
.mk.unklar{color:var(--maay);border-color:rgba(224,164,88,.4);background:rgba(224,164,88,.09)}
.mk.wer{color:var(--schrift3);border-color:var(--linie)}

/* Deutsch = die Quelle. Helles Blatt auf dunklem Pult. */
.quelle{margin:16px;background:var(--papier);color:var(--tinte);border-radius:3px;
 padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.5),0 18px 44px rgba(0,0,0,.36)}
.quellekopf{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
.wort{font:400 40px/1.05 "Instrument Serif",Georgia,serif;letter-spacing:-.005em;word-break:break-word}
.wort.klein{font-size:27px;line-height:1.2}
.plural{font:500 12px "IBM Plex Mono",monospace;color:#6B6357;margin-top:7px;letter-spacing:.03em}
.fehlt{font:italic 400 22px "Instrument Serif",Georgia,serif;color:#9A7B3A}
.hoerknopf{width:52px;height:52px;min-width:52px;border-radius:50%;border:0;background:var(--tinte);
 color:var(--papier);font-size:19px;cursor:pointer;transition:.16s;display:flex;
 align-items:center;justify-content:center}
.hoerknopf:hover{transform:scale(1.06)} .hoerknopf:active{transform:scale(.94)}
.hoerknopf.klein{width:36px;height:36px;min-width:36px;font-size:14px}
.enreihe{display:flex;align-items:center;gap:11px;margin-top:17px;padding-top:15px;
 border-top:1px solid rgba(20,18,15,.13)}
.enmark{font:600 9.5px "IBM Plex Mono",monospace;letter-spacing:.17em;color:#8A8172;flex:0 0 auto}
.entext{flex:1;font:400 16px "IBM Plex Sans",sans-serif;color:#3E382E;word-break:break-word}
.tempo{display:flex;gap:5px;margin-top:14px}
.tempo button{border:1px solid rgba(20,18,15,.16);background:transparent;color:#6B6357;
 border-radius:2px;padding:4px 9px;font:500 10px "IBM Plex Mono",monospace;cursor:pointer;letter-spacing:.06em}
.tempo button.aktiv{background:var(--tinte);color:var(--papier);border-color:var(--tinte)}
.notiz{margin:0 16px 16px;border-left:2px solid var(--maay);background:rgba(224,164,88,.07);
 padding:10px 14px;font:400 13px/1.5 "IBM Plex Sans";color:var(--maay)}

/* ---------- Kanalzug ---------- */
.kanal{margin:0 16px 14px;border:1px solid var(--linie);border-left:3px solid;border-radius:3px;
 background:var(--grund);overflow:hidden}
.kanal.k1{border-left-color:var(--maxaa)}
.kanal.k2{border-left-color:var(--maay)}
.kanalkopf{display:flex;align-items:center;gap:9px;padding:9px 13px;background:var(--pult2);
 border-bottom:1px solid var(--linie)}
.kanalname{font:600 10.5px "IBM Plex Mono",monospace;letter-spacing:.17em;text-transform:uppercase}
.k1 .kanalname{color:var(--maxaa)} .k2 .kanalname{color:var(--maay)}
.kanalort{font:500 10px "IBM Plex Mono",monospace;color:var(--schrift3);letter-spacing:.1em}
.led{width:7px;height:7px;border-radius:50%;background:var(--linie);margin-left:auto;flex:0 0 7px}
.led.an{box-shadow:0 0 7px currentColor}
.k1 .led.an{background:var(--maxaa);color:var(--maxaa)}
.k2 .led.an{background:var(--maay);color:var(--maay)}
.kanalkoerper{padding:13px}
.kfeld{width:100%;padding:12px 13px;border:1px solid var(--linie);border-radius:3px;
 background:var(--pult);color:var(--schrift);font:500 18px "IBM Plex Mono",monospace;transition:.16s}
.kfeld:focus{outline:none;background:var(--pult2)}
.k1 .kfeld:focus{border-color:var(--maxaa);box-shadow:0 0 0 3px rgba(79,178,134,.13)}
.k2 .kfeld:focus{border-color:var(--maay);box-shadow:0 0 0 3px rgba(224,164,88,.13)}
.kfeld::placeholder{color:var(--schrift3);font-weight:400}
textarea.kfeld{resize:vertical;line-height:1.55;font-size:15px}

/* Signatur: die Wellenform */
.welle{height:0;margin-top:0;border-radius:2px;background:#0E0D0B;border:1px solid transparent;
 overflow:hidden;transition:height .25s ease,margin-top .25s ease}
.welle.an{height:56px;margin-top:11px;border-color:var(--linie)}
.welle canvas{display:block;width:100%;height:100%}

.knoepfe{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}
.knoepfe button{padding:9px 13px;border:1px solid var(--linie);background:transparent;
 color:var(--schrift2);border-radius:3px;cursor:pointer;min-height:40px;
 font:500 12px "IBM Plex Mono",monospace;letter-spacing:.07em;text-transform:uppercase;
 transition:.15s;display:inline-flex;align-items:center;gap:6px}
.knoepfe button:hover{border-color:var(--schrift2);color:var(--schrift)}
.knoepfe button:active{transform:translateY(1px)}
.k1 .knoepfe button.haupt{background:var(--maxaa);border-color:var(--maxaa);color:#0C1B14}
.k2 .knoepfe button.haupt{background:var(--maay);border-color:var(--maay);color:#1E1608}
.knoepfe button.aufnahme{background:var(--rec);border-color:var(--rec);color:#fff}
.knoepfe button.aufnahme .dot{width:8px;height:8px;border-radius:50%;background:#fff;
 animation:recpuls 1.05s infinite}
.knoepfe button.weg{color:var(--rec);border-color:rgba(214,73,51,.32)}
.pegelbett{flex:1;min-width:64px;height:3px;background:var(--linie);border-radius:2px;
 align-self:center;overflow:hidden}
.pegel{height:100%;width:0;background:var(--rec);transition:width .07s linear}

/* ---------- Urteil ---------- */
.urteil{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;padding:0 16px 16px}
.urteil button{padding:14px 0 11px;border:1px solid var(--linie);background:transparent;
 color:var(--schrift2);border-radius:3px;cursor:pointer;transition:.15s;
 font:600 12px "IBM Plex Mono",monospace;letter-spacing:.11em;text-transform:uppercase}
.urteil button:hover{border-color:var(--schrift2);color:var(--schrift)}
.urteil button:active{transform:translateY(1px)}
.urteil button .taste{display:block;font-size:9px;color:var(--schrift3);margin-top:4px;letter-spacing:.15em}
.urteil button.aktiv.u1{background:var(--maxaa);border-color:var(--maxaa);color:#0C1B14}
.urteil button.aktiv.u2{background:var(--rec);border-color:var(--rec);color:#fff}
.urteil button.aktiv.u3{background:var(--maay);border-color:var(--maay);color:#1E1608}
.urteil button.aktiv .taste{color:rgba(0,0,0,.42)}
.blaettern{display:flex;gap:9px;margin-top:14px}
.blaettern button{flex:1;padding:14px 0;border:1px solid var(--linie);background:transparent;
 color:var(--schrift2);border-radius:3px;cursor:pointer;transition:.15s;
 font:600 12px "IBM Plex Mono",monospace;letter-spacing:.12em;text-transform:uppercase}
.blaettern button:hover:not(:disabled){border-color:var(--maxaa);color:var(--maxaa)}
.blaettern button:disabled{opacity:.28;cursor:default}
.leer{text-align:center;color:var(--schrift3);padding:64px 20px;
 font:500 13px "IBM Plex Mono",monospace;letter-spacing:.08em}
#fehler{display:none;margin:14px 0;border:1px solid rgba(214,73,51,.34);border-left:3px solid var(--rec);
 background:rgba(214,73,51,.07);border-radius:3px;padding:13px 16px;font-size:14px;color:#EFA294}
#statistik{display:none;margin:14px 0;border:1px solid var(--linie);background:var(--pult);
 border-radius:4px;padding:18px;animation:hoch .28s ease}
#statistik h3{margin:0 0 15px;font:400 22px "Instrument Serif",Georgia,serif}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(94px,1fr));gap:1px;
 background:var(--linie);border:1px solid var(--linie);border-radius:3px;margin-bottom:16px;overflow:hidden}
.kachel{background:var(--grund);padding:13px}
.kachel .z{font:400 27px/1 "Instrument Serif",Georgia,serif;color:var(--maxaa)}
.kachel .l{font:500 9.5px "IBM Plex Mono",monospace;letter-spacing:.13em;text-transform:uppercase;
 color:var(--schrift3);margin-top:6px}
.rangliste{display:flex;flex-direction:column;gap:1px;background:var(--linie);
 border:1px solid var(--linie);border-radius:3px;overflow:hidden}
.rang{display:flex;align-items:center;gap:12px;padding:11px 13px;background:var(--grund)}
.rang .n{font:500 11px "IBM Plex Mono",monospace;color:var(--schrift3);min-width:20px}
.rang .nm{flex:1;font-weight:500;font-size:14px}
.rang .ct{font:500 14px "IBM Plex Mono",monospace;color:var(--maxaa)}
.rang.ich{background:var(--pult2)} .rang.ich .nm{color:var(--maxaa)}
footer{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(20,18,15,.95);
 backdrop-filter:blur(14px);border-top:1px solid var(--linie);
 padding:9px 0 max(9px,env(safe-area-inset-bottom))}
.fbtn{display:flex;gap:8px}
.fbtn button{flex:1;padding:11px 6px;border:1px solid var(--linie);background:transparent;
 color:var(--schrift2);border-radius:3px;cursor:pointer;transition:.15s;
 font:600 11px "IBM Plex Mono",monospace;letter-spacing:.1em;text-transform:uppercase}
.fbtn button:hover{border-color:var(--maxaa);color:var(--maxaa)}
.fbtn button.haupt{background:var(--maxaa);border-color:var(--maxaa);color:#0C1B14}
.tastenhilfe{text-align:center;font:500 9.5px "IBM Plex Mono",monospace;color:var(--schrift3);
 letter-spacing:.11em;margin:8px 0 0}
@media(max-width:520px){ .wort{font-size:32px} .tastenhilfe{display:none} }
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
:focus-visible{outline:2px solid var(--maxaa);outline-offset:2px}
</style>
</head>
<body>

<div id="tor">
  <div class="torkarte">
    <div class="torlogo">
      <svg width="30" height="30" viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <path d="M3 22h6M23 22h6" stroke="#E0A458" stroke-width="2.6" stroke-linecap="round"/>
        <path d="M9 22c0-5 3.2-8 7-8s7 3 7 8" stroke="#4FB286" stroke-width="2.6" stroke-linecap="round"/>
        <circle cx="16" cy="10" r="2.4" fill="#D64933"/>
      </svg>
      <span class="wortmarke">Lingo <em>Check</em></span>
    </div>
    <p class="unter">Somali · Prüfen · Aufnehmen</p>
    <label for="namefeld">Name</label>
    <input id="namefeld" placeholder="Yusuf" autocomplete="name" onkeydown="if(event.key==='Enter')anmelden()">
    <button class="torbtn" onclick="anmelden()">Pult öffnen</button>
    <p class="torhinweis">Der Name zeigt an, wer welchen Eintrag geprüft hat.<br>Kein Passwort, keine E-Mail.</p>
  </div>
</div>

<div id="schleier" onclick="menueZu()"></div>
<nav id="menue">
  <div class="menuekopf">
    <h2>Menü</h2>
    <button class="zu" onclick="menueZu()" aria-label="Menü schließen">✕</button>
  </div>
  <div class="menueinhalt" id="menueinhalt"></div>
</nav>

<header>
  <div class="mitte">
    <div class="kopf">
      <button class="burger" onclick="menueAuf()" aria-label="Menü öffnen"><span></span><span></span><span></span></button>
      <span class="kopfmarke">Lingo <em>Check</em></span>
      <span class="mono sitzung">Heute <b id="heute">0</b></span>
      <button class="ichchip" id="ichPille" onclick="abmelden()">—</button>
    </div>
  </div>
  <div class="spur"><i id="balken"></i></div>
  <div class="mitte">
    <div class="suchreihe">
      <input id="suchfeld" placeholder="suchen …" oninput="suchen(this.value)">
    </div>
    <p id="ladeinfo"></p>
    <div class="chips" id="chips"></div>
  </div>
</header>

<div class="mitte">
  <div id="fehler"></div>
  <div id="statistik"></div>
</div>

<main class="mitte">
  <div id="karte"><p class="leer">wird geladen …</p></div>
  <div class="blaettern">
    <button id="zurueck" onclick="blaettern(-1)">← zurück</button>
    <button id="weiter" onclick="blaettern(1)">weiter →</button>
  </div>
  <p class="tastenhilfe">← → blättern · 1 2 3 urteilen · leertaste deutsch · R aufnehmen</p>
</main>

function oeffneDB(){return new Promise(res=>{let f=false;

    if(!db.objectStoreNames.contains('audio'))db.createObjectStore('audio');

  r.onblocked=()=>zeigeFehler('<b>Bitte andere Tabs dieser Seite schließen.</b>');

function put(s,k,v){return new Promise(r=>{if(!DB)return r();
  try{const t=DB.transaction(s,'readwrite');t.objectStore(s).put(v,k);t.oncomplete=r;t.onerror=r;}catch(e){r();}});}
function hole(s,k){return new Promise(r=>{if(!DB)return r(undefined);
  try{const q=DB.transaction(s,'readonly').objectStore(s).get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(undefined);}catch(e){r(undefined);}});}
function entferne(s,k){return new Promise(r=>{if(!DB)return r();
  try{const t=DB.transaction(s,'readwrite');t.objectStore(s).delete(k);t.oncomplete=r;t.onerror=r;}catch(e){r();}});}
function alleKeys(s){return new Promise(r=>{if(!DB)return r([]);

function besteStimme(lang){

/* ---------- Aufnahme mit Wellenform ---------- */
async function starteAufnahme(key){
  if(rec[key])return;
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    const mr=new MediaRecorder(stream); const ch=[];
    const AC=window.AudioContext||window.webkitAudioContext;
    let ctx=null,an=null,raf=null;
    try{
      ctx=new AC(); const src=ctx.createMediaStreamSource(stream);
      an=ctx.createAnalyser(); an.fftSize=1024; src.connect(an);
    }catch(e){}
    mr.ondataavailable=e=>{if(e.data.size)ch.push(e.data);};
    mr.onstop=async()=>{
      if(raf)cancelAnimationFrame(raf);
      if(ctx)try{ctx.close();}catch(e){}
      stream.getTracks().forEach(t=>t.stop());
      const b=new Blob(ch,{type:mr.mimeType||'audio/webm'});
      await put('audio',key,b); rec[key]=null; await zeichne();
      const p=await audioHoch(key,b);
      if(p){await zentraleAudiosLaden();zeichne();}
    };
    mr.start();
    rec[key]={mr,start:Date.now()};
    await zeichne();
    // Wellenform zeichnen
    const cv=$('welle_'+key.replace(/:/g,'_'));
    const pg=$('pegel_'+key.replace(/:/g,'_'));
    const zeit=$('zeit_'+key.replace(/:/g,'_'));
    if(cv&&an){
      const c=cv.getContext('2d');
      const dat=new Uint8Array(an.fftSize);
      const farbe=key.slice(-3)===':so'?'#4FB286':'#E0A458';
      const male=()=>{
        if(!rec[key]){return;}
        raf=requestAnimationFrame(male);
        const w=cv.width=cv.clientWidth*(window.devicePixelRatio||1);
        const h=cv.height=cv.clientHeight*(window.devicePixelRatio||1);
        an.getByteTimeDomainData(dat);
        c.clearRect(0,0,w,h);
        // Mittellinie
        c.strokeStyle='rgba(255,255,255,.07)';c.lineWidth=1;
        c.beginPath();c.moveTo(0,h/2);c.lineTo(w,h/2);c.stroke();
        // Wellenform
        c.strokeStyle=farbe;c.lineWidth=2*(window.devicePixelRatio||1);
        c.lineJoin='round';c.beginPath();
        const step=w/dat.length; let max=0;
        for(let i=0;i<dat.length;i++){
          const v=(dat[i]-128)/128; if(Math.abs(v)>max)max=Math.abs(v);
          const y=h/2+v*(h/2-3);
          i?c.lineTo(i*step,y):c.moveTo(0,y);
        }
        c.stroke();
        if(pg)pg.style.width=Math.min(100,max*165)+'%';
        if(zeit&&rec[key])zeit.textContent=((Date.now()-rec[key].start)/1000).toFixed(1)+'s';
      };
      male();
    }
  }catch(e){
    zeigeFehler('<b>Kein Mikrofonzugriff.</b> Im Browser erlauben — Schloss-Symbol links in der Adresszeile.');
  }
}

       '<button class="hoerknopf klein" onclick="sprichEn()" title="Englisch anhören">▶</button></div>':'')+
  '<div class="tempo">'+[[0.6,'langsam'],[0.85,'normal'],[1,'schnell']].map(t=>
    '<button class="'+(tempo===t[0]?'aktiv':'')+'" onclick="setTempo('+t[0]+')">'+t[1]+'</button>').join('')+'</div>'+
  (!e.de?'<input class="kfeld" style="margin-top:14px;background:#fff;color:#14120F;border-color:rgba(20,18,15,.2)" placeholder="deutsche übersetzung" value="'+esc(p.de)+'" oninput="setze(\''+e.i+'\',\'de\',this.value)">':'')+

  '</div>';

  $('zurueck').disabled=idx===0;$('weiter').disabled=idx>=l.length-1;
}

function kanal(kl,key,name,ort,wert,eid,feld,lang){
  const hat=lokaleAudios.has(key)||zentraleAudios.has(key);
  const nurZ=zentraleAudios.has(key)&&!lokaleAudios.has(key);
  const laeuft=!!rec[key];
  const id=key.replace(/:/g,'_');
  return '<div class="kanal '+kl+'">'+
    '<div class="kanalkopf"><span class="kanalname">'+name+'</span>'+
      '<span class="kanalort">'+ort+'</span>'+
      '<span class="led'+(hat?' an':'')+'"></span></div>'+
    '<div class="kanalkoerper">'+
    (lang?'<textarea class="kfeld" rows="3" oninput="setze(\''+eid+'\',\''+feld+'\',this.value)">'+esc(wert)+'</textarea>'
         :'<input class="kfeld" placeholder="'+name.toLowerCase()+' eintragen" value="'+esc(wert)+'" oninput="setze(\''+eid+'\',\''+feld+'\',this.value)">')+
    '<div class="welle'+(laeuft?' an':'')+'"><canvas id="welle_'+id+'"></canvas></div>'+
    '<div class="knoepfe">'+
      (laeuft
        ? '<button class="aufnahme" onclick="stoppeAufnahme(\''+key+'\')"><span class="dot"></span>stopp <span id="zeit_'+id+'">0.0s</span></button>'+
          '<span class="pegelbett"><span class="pegel" id="pegel_'+id+'"></span></span>'
        : (hat?'<button onclick="spieleAb(\''+key+'\')">▶ anhören'+(nurZ?' ☁':'')+'</button>':'')+
          '<button class="haupt" onclick="starteAufnahme(\''+key+'\')">● '+(hat?'neu aufnehmen':'aufnehmen')+'</button>'+
          (hat?'<button onclick="ladeRunter(\''+key+'\')">⤓ datei</button>'+
               (lokaleAudios.has(key)?'<button class="weg" onclick="loescheAudio(\''+key+'\')">löschen</button>':''):''))+
    '</div></div></div>';
}

/* ---------- Statistik ---------- */
function zeigeStatistik(){
  const el=$('statistik');
  if(el.style.display==='block'){el.style.display='none';return;}
  const w=Object.values(korr).filter(p=>p&&p.urteil);
  const pp={};Object.values(korr).forEach(p=>{if(p&&p.urteil){const x=p._wer||'unbekannt';pp[x]=(pp[x]||0)+1;}});
  const rang=Object.entries(pp).sort((a,b)=>b[1]-a[1]);
  const mY=Object.values(korr).filter(p=>p&&p.ymm).length;
  const au=new Set([...lokaleAudios,...zentraleAudios.keys()]).size;
  el.style.display='block';
  el.innerHTML='<h3>Statistik</h3><div class="statgrid">'+
    K(w.length,'geprüft')+K(w.filter(p=>p.urteil==='ok').length,'richtig')+
    K(w.filter(p=>p.urteil==='falsch').length,'falsch')+K(mY,'af-maay')+
    K(au,'aufnahmen')+K(DATEN.length,'gesamt')+'</div>'+
    (rang.length?'<div class="rangliste">'+rang.map((r,i)=>'<div class="rang'+(r[0]===ICH?' ich':'')+'">'+
      '<span class="n">'+String(i+1).padStart(2,'0')+'</span><span class="nm">'+esc(r[0])+'</span>'+
      '<span class="ct">'+r[1].toLocaleString('de')+'</span></div>').join('')+'</div>'
     :'<p style="color:var(--schrift3);margin:0;font:500 12px \'IBM Plex Mono\',monospace">noch nichts geprüft</p>');
  el.scrollIntoView({behavior:'smooth',block:'nearest'});
}
const K=(z,l)=>'<div class="kachel"><div class="z">'+Number(z).toLocaleString('de')+'</div><div class="l">'+l+'</div></div>';

/* ---------- Export ---------- */
function exportJSON(){
  const r={};for(const k in korr){const o=Object.assign({},korr[k]);delete o._zeit;delete o._wer;
    if(Object.keys(o).length)r[k]=o;}
  const b=new Blob([JSON.stringify({bearbeiter:ICH,stand:new Date().toISOString(),daten:r},null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);
  a.download='lingo-check-'+(ICH||'export')+'-'+new Date().toISOString().slice(0,10)+'.json';a.click();menueZu();
}
async function importJSON(ev){const f=ev.target.files[0];if(!f)return;
  try{const j=JSON.parse(await f.text());const neu=j.daten||j;const wer=j.bearbeiter||'Import';
    for(const k in neu)korr[k]=Object.assign({},korr[k],neu[k],{_zeit:new Date().toISOString(),_wer:wer});
    await put('korr','alle',korr);
    if(ONLINE)for(const k in neu)await zentralSpeichern(k);
    menueZu();zeichne();
  }catch(e){zeigeFehler('Datei konnte nicht gelesen werden.');}
  ev.target.value='';}
async function alleAudios(){const keys=[...new Set([...lokaleAudios,...zentraleAudios.keys()])];
  if(!keys.length){menueZu();zeigeFehler('Noch keine Aufnahmen vorhanden.');return;}
  if(!confirm(keys.length+' Aufnahmen herunterladen?'))return;menueZu();
  for(const k of keys){const e=DATEN.find(d=>k.indexOf('audio:'+d.i+':')===0);
    await ladeRunter(k,e?(k.slice(-3)===':so'?e.so:e.ymm):'');await new Promise(r=>setTimeout(r,250));}}

/* ---------- Laden ---------- */
async function ladeBlock(n,versuche){
  if(geladen.has(n))return;
  versuche=versuche||4;
  let letzterFehler=null;
  for(let v=0;v<versuche;v++){
    try{
      const r=await fetch('daten'+n+'.json?v=5');
      if(r.ok){ DATEN=DATEN.concat(await r.json()); geladen.add(n); return; }
      letzterFehler='HTTP '+r.status;
    }catch(e){ letzterFehler=e.message; }
    await new Promise(r=>setTimeout(r,400*(v+1)));   // 400, 800, 1200 ms
  }
  throw new Error('daten'+n+': '+letzterFehler);
}
async function ladeRest(){
  const i=$('ladeinfo');
  const gescheitert=[];
  for(let n=1;n<VERZ.bloecke;n++){
    try{ await ladeBlock(n); }
    catch(e){ gescheitert.push(n); console.warn(e.message); }
    if(i)i.textContent=DATEN.length.toLocaleString('de')+' / '+VERZ.gesamt.toLocaleString('de')+' geladen';
    await new Promise(r=>setTimeout(r,120));   // Server nicht ueberrennen
  }
  if(gescheitert.length){
    zeigeFehler('<b>'+gescheitert.length+' Datenblock/-bloecke fehlen.</b> '+
      'Es fehlen dadurch einige Eintraege. '+
      '<button onclick="nachladen()" style="margin-left:8px;padding:5px 11px;border:1px solid currentColor;'+
      'background:transparent;color:inherit;border-radius:3px;cursor:pointer;font:600 11px monospace;'+
      'letter-spacing:.09em;text-transform:uppercase">nochmal versuchen</button>');
  }
  if(i)i.textContent='';
  zeichne();
}
async function nachladen(){
  $('fehler').style.display='none';
  for(let n=0;n<VERZ.bloecke;n++){
    if(geladen.has(n))continue;
    try{ await ladeBlock(n,5); }catch(e){ console.warn(e.message); }
  }
  zeichne();
}
function suchen(v){suche=v;idx=0;zeichne();}
function blaettern(n){const l=liste();idx=Math.max(0,Math.min(l.length-1,idx+n));positionMerken();zeichne();}
function anmelden(){const v=$('namefeld').value.trim();if(!v){$('namefeld').focus();return;}
  ICH=v;try{localStorage.setItem('lc_name',ICH);}catch(e){}
  $('tor').style.display='none';$('ichPille').textContent=ICH;starten();}
function abmelden(){if(!confirm('Abmelden? Die Arbeit bleibt gespeichert.'))return;
  try{localStorage.removeItem('lc_name');}catch(e){}location.reload();}

/* ---------- Tastatur ---------- */
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){menueZu();return;}
  const t=e.target.tagName;
  if(t==='INPUT'||t==='TEXTAREA')return;
  const l=liste();const cur=l[idx];
  if(e.key==='ArrowRight'){e.preventDefault();blaettern(1);}
  else if(e.key==='ArrowLeft'){e.preventDefault();blaettern(-1);}
  else if(e.key===' '){e.preventDefault();sprichDe();}
  else if(e.key==='1'&&cur)urteil(cur.i,'ok');
  else if(e.key==='2'&&cur)urteil(cur.i,'falsch');
  else if(e.key==='3'&&cur)urteil(cur.i,'unklar');
  else if((e.key==='r'||e.key==='R')&&cur){
    const k='audio:'+cur.i+':so';rec[k]?stoppeAufnahme(k):starteAufnahme(k);}
});

async function starten(){
  try{
    DB=await oeffneDB();
    if(!DB)zeigeFehler('<b>Lokaler Speicher nicht verfügbar.</b> Privates Fenster? Dann normal öffnen.');
    korr=(await hole('korr','alle'))||{};
    ONLINE=!!(CONFIG.SUPABASE_URL&&CONFIG.SUPABASE_KEY);
    const rv=await fetch('verzeichnis.json?v=5');
    if(!rv.ok)throw new Error('verzeichnis.json HTTP '+rv.status);
    VERZ=await rv.json();
    await ladeBlock(0);await zeichne();
    if(ONLINE){await zentralLaden();await zentraleAudiosLaden();
      const p=await positionHolen();if(p&&p.kategorie){kat=p.kategorie;idx=p.position||0;}
      zeichne();}
    ladeRest();
  }catch(err){
    zeigeFehler('<b>Fehler beim Laden:</b> '+err.message+'<br>Bitte mit Strg+F5 neu laden.');
    $('karte').innerHTML='<p class="leer">konnte nicht geladen werden</p>';
  }
}
function init(){if(ICH){$('tor').style.display='none';$('ichPille').textContent=ICH;starten();}
  else $('namefeld').focus();}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
</script>
