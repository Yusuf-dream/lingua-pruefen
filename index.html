<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lingo Check</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#0B3B45">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF8F3; --bg2:#F2EBE1; --karte:#fff; --kante:#E6DCCB;
  --tinte:#12252B; --tinte2:#4C6068; --tinte3:#8798A0;
  --petrol:#0B3B45; --petrol2:#155B6B;
  --koralle:#E2542B; --koralle2:#C4441F;
  --gruen:#2C6A4C; --gruenF:#E7F1EA;
  --amber:#B0700A; --amberF:#FAEFDA;
  --rot:#AE251D;
  --sch1:0 1px 2px rgba(18,37,43,.05),0 6px 18px rgba(18,37,43,.06);
  --sch2:0 2px 6px rgba(18,37,43,.07),0 16px 44px rgba(18,37,43,.10);
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;padding:0 0 152px;color:var(--tinte);
 font:17px/1.55 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
 background:
  radial-gradient(1200px 520px at 12% -8%,rgba(11,59,69,.08),transparent 62%),
  radial-gradient(950px 440px at 92% 2%,rgba(226,84,43,.075),transparent 62%),
  var(--bg);
 background-attachment:fixed}
.mitte{width:100%;max-width:760px;margin-left:auto;margin-right:auto;padding-left:18px;padding-right:18px}

/* ================= Anmeldung ================= */
#tor{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
 padding:22px;background:
  radial-gradient(900px 500px at 20% 10%,rgba(11,59,69,.12),transparent 60%),
  radial-gradient(700px 420px at 85% 85%,rgba(226,84,43,.12),transparent 60%),var(--bg)}
.torkarte{width:100%;max-width:430px;background:var(--karte);border:1px solid var(--kante);
 border-radius:22px;padding:34px 28px;box-shadow:var(--sch2);animation:rein .5s cubic-bezier(.2,.9,.2,1)}
.logo{display:flex;align-items:center;justify-content:center;gap:11px;margin-bottom:6px}
.logo h1{margin:0;font:800 30px/1 Fraunces,Georgia,serif;letter-spacing:-.02em}
.torkarte .unter{text-align:center;color:var(--tinte2);font-size:15px;margin:0 0 26px}
.torkarte label{display:block;font:700 11px Inter;letter-spacing:.1em;text-transform:uppercase;
 color:var(--tinte3);margin:0 0 7px}
.torkarte input{width:100%;padding:15px 16px;border:1px solid var(--kante);border-radius:12px;
 font-size:17px;font-family:inherit;background:var(--bg);transition:border-color .18s,box-shadow .18s}
.torkarte input:focus{outline:none;border-color:var(--petrol);box-shadow:0 0 0 4px rgba(11,59,69,.10);background:#fff}
.torbtn{width:100%;margin-top:20px;padding:16px;border:0;border-radius:12px;background:var(--koralle);
 color:#fff;font:800 17px Inter;cursor:pointer;box-shadow:0 4px 18px rgba(226,84,43,.32);transition:.16s}
.torbtn:hover{background:var(--koralle2)}
.torbtn:active{transform:scale(.98)}
.torhinweis{margin:18px 0 0;font-size:13px;color:var(--tinte3);text-align:center;line-height:1.5}

/* ================= Kopf ================= */
header{position:sticky;top:0;z-index:40;background:rgba(251,248,243,.94);
 backdrop-filter:blur(12px);border-bottom:1px solid var(--kante)}
.kopf{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0 8px}
.marke{display:flex;align-items:center;gap:9px;min-width:0}
.marke h1{margin:0;font:800 20px/1 Fraunces,Georgia,serif;letter-spacing:-.02em;white-space:nowrap}
.kopfrechts{display:flex;align-items:center;gap:8px}
.pille{display:inline-flex;align-items:center;gap:5px;background:var(--bg2);border:1px solid var(--kante);
 border-radius:99px;padding:5px 11px;font:600 12px Inter;color:var(--tinte2);white-space:nowrap;cursor:pointer}
.pille.online{background:#E4F1EE;border-color:#B2DACF;color:var(--gruen)}
.pille.ich{background:var(--petrol);border-color:var(--petrol);color:#fff}
.balkenbett{height:8px;background:var(--bg2);border:1px solid var(--kante);border-radius:99px;overflow:hidden}
.balken{height:100%;width:0;border-radius:99px;
 background:linear-gradient(90deg,var(--petrol),var(--gruen) 60%,var(--amber));
 transition:width .8s cubic-bezier(.2,.9,.2,1)}
.zahlzeile{display:flex;justify-content:space-between;font:600 12px Inter;color:var(--tinte3);margin-top:6px}
.suchbox{position:relative;margin:9px 0 4px}
#suchfeld{width:100%;padding:13px 14px 13px 42px;border:1px solid var(--kante);border-radius:12px;
 font-size:16px;background:var(--karte);font-family:inherit;transition:.18s}
#suchfeld:focus{outline:none;border-color:var(--petrol);box-shadow:0 0 0 4px rgba(11,59,69,.10)}
.lupe{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--tinte3);pointer-events:none}
#ladeinfo{font-size:12px;color:var(--tinte3);margin:5px 0 9px;min-height:15px}

/* ================= Filter ================= */
.filterzeile{display:flex;gap:8px;overflow-x:auto;padding:12px 18px;scrollbar-width:none}
.filterzeile::-webkit-scrollbar{display:none}
.filterzeile button{flex:0 0 auto;padding:9px 15px;border:1px solid var(--kante);background:var(--karte);
 color:var(--tinte2);border-radius:99px;font:600 14px Inter;cursor:pointer;white-space:nowrap;transition:.18s}
.filterzeile button:hover{border-color:var(--petrol);color:var(--petrol);transform:translateY(-1px)}
.filterzeile button.aktiv{background:var(--petrol);color:#fff;border-color:var(--petrol);
 box-shadow:0 3px 14px rgba(11,59,69,.3)}
.werkzeuge{display:flex;gap:9px;flex-wrap:wrap;padding-bottom:13px}
.werkzeuge button{padding:9px 15px;border:1px solid var(--kante);background:var(--karte);border-radius:11px;
 font:600 14px Inter;cursor:pointer;color:var(--tinte2);transition:.18s}
.werkzeuge button:hover{border-color:var(--tinte3)}
.werkzeuge button.aktiv{background:var(--gruen);color:#fff;border-color:var(--gruen)}

/* ================= Karte ================= */
@keyframes rein{from{opacity:0;transform:translateY(16px) scale(.99)}to{opacity:1;transform:none}}
@keyframes blitzGut{0%{background:#E4F1EA;border-color:var(--gruen)}100%{background:var(--karte);border-color:var(--kante)}}
#karte{background:var(--karte);border:1px solid var(--kante);border-radius:20px;padding:22px;
 box-shadow:var(--sch1);animation:rein .34s cubic-bezier(.2,.9,.2,1)}
#karte.gut{animation:blitzGut .7s ease}
.kopfzeile{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px}
.zaehler{font:700 11px Inter;color:var(--tinte3);letter-spacing:.09em}
.warn{background:#FCE7DE;color:var(--koralle2);font:800 10px Inter;padding:5px 11px;border-radius:99px;
 letter-spacing:.08em;text-transform:uppercase}
.wer{background:var(--bg2);color:var(--tinte2);font:600 11px Inter;padding:5px 11px;border-radius:99px}
.dezeile{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;
 border-bottom:1px solid var(--bg2);padding-bottom:16px}
.de{font:800 29px/1.14 Fraunces,Georgia,serif;letter-spacing:-.018em;word-break:break-word}
.fehlt{font:italic 600 16px Inter;color:var(--amber)}
.pl{font-size:14px;color:var(--tinte3);margin-top:4px}
.en{font-size:14px;color:var(--tinte2);margin-top:7px}
.en b{color:var(--tinte3);font:700 10px Inter;letter-spacing:.1em;margin-right:5px}
.rund{width:54px;height:54px;min-width:54px;border-radius:50%;border:1px solid var(--kante);
 background:var(--karte);font-size:22px;cursor:pointer;box-shadow:var(--sch1);transition:.16s}
.rund:hover{border-color:var(--petrol);box-shadow:var(--sch2);transform:translateY(-2px)}
.rund:active{transform:scale(.93)}
.notiz{margin-top:15px;background:var(--amberF);border-left:4px solid var(--amber);padding:11px 15px;
 font-size:14px;color:#6A4300;border-radius:0 11px 11px 0}
.block{margin-top:17px;padding:15px;border-radius:15px;border:1px solid transparent}
.block.gruen{background:var(--gruenF);border-color:#CDE2D6}
.block.amber{background:var(--amberF);border-color:#EEDAB6}
.blabel{display:flex;align-items:center;gap:8px;font:800 11px Inter;letter-spacing:.1em;
 text-transform:uppercase;margin-bottom:10px}
.punkt{width:9px;height:9px;border-radius:50%;flex:0 0 9px}
.gruen .blabel{color:var(--gruen)} .gruen .punkt{background:var(--gruen)}
.amber .blabel{color:var(--amber)} .amber .punkt{background:var(--amber)}
.feld{width:100%;padding:14px;border:1px solid var(--kante);border-radius:12px;font-size:16px;
 background:var(--karte);font-family:inherit;color:var(--tinte);transition:.18s}
.feld:focus{outline:none;border-color:var(--petrol);box-shadow:0 0 0 4px rgba(11,59,69,.10)}
.feld.gross{font-size:20px;font-weight:600}
textarea.feld{resize:vertical;line-height:1.5}
.anmerkung{margin-top:15px}
.audio{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.audio button{padding:12px 15px;border:1px solid var(--kante);background:var(--karte);border-radius:11px;
 font:600 14px Inter;cursor:pointer;min-height:47px;color:var(--tinte2);transition:.16s;
 display:inline-flex;align-items:center;gap:6px}
.audio button:hover{border-color:var(--tinte3)}
.audio button:active{transform:scale(.96)}
.audio button.gruen{background:var(--gruen);color:#fff;border-color:var(--gruen);box-shadow:0 3px 13px rgba(44,106,76,.28)}
.audio button.amber{background:var(--amber);color:#fff;border-color:var(--amber);box-shadow:0 3px 13px rgba(176,112,10,.28)}
.audio button.loesch{color:var(--rot);border-color:#EBC8C5;background:transparent}
@keyframes puls{0%{box-shadow:0 0 0 0 rgba(174,37,29,.45)}70%{box-shadow:0 0 0 15px rgba(174,37,29,0)}100%{box-shadow:0 0 0 0 rgba(174,37,29,0)}}
.audio button.rot{background:var(--rot);color:#fff;border-color:var(--rot);animation:puls 1.6s infinite}
@keyframes blink{50%{opacity:.3}}
.pulsi{color:var(--rot);font:600 14px Inter;align-self:center;animation:blink 1.1s infinite}
.urteile{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:19px}
.urteile button{padding:15px 0;border:1px solid var(--kante);background:var(--karte);border-radius:13px;
 font:700 14px Inter;cursor:pointer;color:var(--tinte2);transition:.16s}
.urteile button:hover{border-color:var(--tinte3);transform:translateY(-1px)}
.urteile button:active{transform:scale(.96)}
.urteile button.aktiv.ok{background:var(--gruen);color:#fff;border-color:var(--gruen);box-shadow:0 4px 15px rgba(44,106,76,.3)}
.urteile button.aktiv.falsch{background:var(--rot);color:#fff;border-color:var(--rot);box-shadow:0 4px 15px rgba(174,37,29,.3)}
.urteile button.aktiv.unklar{background:var(--amber);color:#fff;border-color:var(--amber);box-shadow:0 4px 15px rgba(176,112,10,.3)}
.blaettern{display:flex;gap:11px;margin-top:15px}
.blaettern button{flex:1;padding:17px 0;border-radius:14px;font:700 16px Inter;cursor:pointer;
 border:1px solid var(--kante);background:var(--karte);color:var(--tinte2);transition:.16s}
.blaettern button:hover:not(:disabled){border-color:var(--tinte3)}
.blaettern button:active:not(:disabled){transform:scale(.98)}
.blaettern button.haupt{background:var(--koralle);color:#fff;border-color:var(--koralle);box-shadow:0 4px 17px rgba(226,84,43,.3)}
.blaettern button.haupt:hover:not(:disabled){background:var(--koralle2)}
.blaettern button:disabled{opacity:.34;cursor:default}
.leer{text-align:center;color:var(--tinte3);padding:58px 0}
#fehler{display:none;margin:14px 0;background:#FCEAE8;border:1px solid #F2C4C0;border-left:4px solid var(--rot);
 border-radius:0 12px 12px 0;padding:14px 17px;font-size:14px;color:#711B15}

/* ================= Statistik ================= */
#statistik{display:none;margin:14px 0;background:var(--karte);border:1px solid var(--kante);
 border-radius:18px;padding:20px;box-shadow:var(--sch1);animation:rein .3s ease}
#statistik h3{margin:0 0 14px;font:800 18px Fraunces,Georgia,serif}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:11px;margin-bottom:18px}
.statkachel{background:var(--bg);border:1px solid var(--kante);border-radius:13px;padding:13px}
.statkachel .z{font:800 25px/1 Fraunces,Georgia,serif;color:var(--petrol)}
.statkachel .l{font:600 11px Inter;color:var(--tinte3);letter-spacing:.05em;text-transform:uppercase;margin-top:5px}
.rangliste{display:flex;flex-direction:column;gap:8px}
.rang{display:flex;align-items:center;gap:11px;padding:11px 13px;background:var(--bg);
 border:1px solid var(--kante);border-radius:12px}
.rang .pos{font:800 15px Fraunces,Georgia,serif;color:var(--tinte3);min-width:22px}
.rang .nm{flex:1;font-weight:600}
.rang .ct{font:800 16px Inter;color:var(--gruen)}
.rang.ich{border-color:var(--petrol);background:#EFF5F6}

footer{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(251,248,243,.96);
 backdrop-filter:blur(12px);border-top:1px solid var(--kante);padding:11px 0 max(11px,env(safe-area-inset-bottom))}
.fbtn{display:flex;gap:8px;flex-wrap:wrap}
.fbtn button,.fbtn label{flex:1;min-width:104px;padding:13px 8px;border-radius:12px;font:700 14px Inter;
 cursor:pointer;text-align:center;border:1px solid var(--kante);background:var(--karte);color:var(--tinte2);transition:.16s}
.fbtn button:hover,.fbtn label:hover{border-color:var(--tinte3)}
.fbtn button:active{transform:scale(.97)}
.fbtn button.haupt{background:var(--petrol);color:#fff;border-color:var(--petrol);box-shadow:0 3px 13px rgba(11,59,69,.28)}
.hinw{text-align:center;font-size:12px;color:var(--tinte3);margin:8px 0 0}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<!-- ===================== Anmeldung ===================== -->
<div id="tor">
  <div class="torkarte">
    <div class="logo">
      <svg width="34" height="34" viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <path d="M3 22h6M23 22h6" stroke="#E2542B" stroke-width="3" stroke-linecap="round"/>
        <path d="M9 22c0-5 3.2-8 7-8s7 3 7 8" stroke="#0B3B45" stroke-width="3" stroke-linecap="round"/>
        <circle cx="16" cy="10" r="2.6" fill="#B0700A"/>
      </svg>
      <h1>Lingo Check</h1>
    </div>
    <p class="unter">Somali prüfen, verbessern, aufnehmen</p>
    <label for="namefeld">Dein Name</label>
    <input id="namefeld" placeholder="z. B. Yusuf" autocomplete="name"
           onkeydown="if(event.key==='Enter')anmelden()">
    <button class="torbtn" onclick="anmelden()">Loslegen</button>
    <p class="torhinweis">Der Name zeigt nur an, wer welchen Eintrag geprüft hat.<br>Kein Passwort, keine E-Mail.</p>
  </div>
</div>

<!-- ===================== Anwendung ===================== -->
<header>
  <div class="mitte">
    <div class="kopf">
      <div class="marke">
        <svg width="26" height="26" viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <path d="M3 22h6M23 22h6" stroke="#E2542B" stroke-width="3" stroke-linecap="round"/>
          <path d="M9 22c0-5 3.2-8 7-8s7 3 7 8" stroke="#0B3B45" stroke-width="3" stroke-linecap="round"/>
          <circle cx="16" cy="10" r="2.6" fill="#B0700A"/>
        </svg>
        <h1>Lingo Check</h1>
      </div>
      <div class="kopfrechts">
        <span class="pille" id="sync">…</span>
        <span class="pille ich" id="ichPille" onclick="abmelden()">…</span>
      </div>
    </div>
    <div class="balkenbett"><div class="balken" id="balken"></div></div>
    <div class="zahlzeile">
      <span id="fortschritt">0 / 0</span>
      <span>🎙 <span id="mitAudio">0</span> Aufnahmen</span>
    </div>
    <div class="suchbox">
      <svg class="lupe" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
      </svg>
      <input id="suchfeld" placeholder="Suchen …" oninput="suchen(this.value)">
    </div>
    <p id="ladeinfo"></p>
  </div>
</header>

<div class="filterzeile" id="filter"></div>

<div class="mitte">
  <div class="werkzeuge">
    <button id="offenBtn" onclick="toggleOffen()">nur ungeprüfte</button>
    <button onclick="zeigeStatistik()">📊 Statistik</button>
  </div>
  <div id="fehler"></div>
  <div id="statistik"></div>
</div>

<main class="mitte">
  <div id="karte"><p class="leer">Wird geladen …</p></div>
  <div class="blaettern">
    <button id="zurueck" onclick="blaettern(-1)">← Zurück</button>
    <button id="weiter" class="haupt" onclick="blaettern(1)">Weiter →</button>
  </div>
</main>

<footer>
  <div class="mitte">
    <div class="fbtn">
      <button class="haupt" onclick="exportJSON()">⤓ Sichern</button>
      <label>⤒ Laden<input type="file" accept=".json" onchange="importJSON(event)" style="display:none"></label>
      <button onclick="alleAudios()">🎙 Audios</button>
    </div>
    <p class="hinw">Speichert automatisch</p>
  </div>
</footer>

<script>
/* ====================== Einstellungen ====================== */
const CONFIG = { SUPABASE_URL:"", SUPABASE_KEY:"", TEAM_CODE:"lingo-check-2026" };

let DB=null, DATEN=[], korr={}, VERZ=null;
let kat='behoerde', nurOffen=false, idx=0, suche='';
let ICH='', ONLINE=false, geladen=new Set();
let lokaleAudios=new Set(), zentraleAudios=new Map();
const rec={};

try{ ICH = localStorage.getItem('lc_name')||''; }catch(e){}

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }
function zeigeFehler(t){ const el=$('fehler'); if(el){ el.style.display='block'; el.innerHTML=t; } console.error(t); }
function zeigeSync(t,d){ const el=$('sync'); if(!el)return; el.textContent=t;
  setTimeout(()=>{ if(el.textContent===t){ el.textContent=ONLINE?'☁ verbunden':'○ dieses Gerät'; el.classList.toggle('online',ONLINE);} }, d||2400); }

/* ====================== Anmeldung ====================== */
function anmelden(){
  const v=$('namefeld').value.trim();
  if(!v){ $('namefeld').focus(); return; }
  ICH=v; try{ localStorage.setItem('lc_name',ICH); }catch(e){}
  $('tor').style.display='none';
  $('ichPille').textContent='👤 '+ICH;
  starten();
}
function abmelden(){
  if(!confirm('Abmelden? Deine Arbeit bleibt gespeichert.'))return;
  try{ localStorage.removeItem('lc_name'); }catch(e){}
  location.reload();
}

/* ====================== IndexedDB ====================== */
function oeffneDB(){ return new Promise(res=>{
  let fertig=false;
  const r=indexedDB.open('lingocheck',1);
  r.onupgradeneeded=e=>{ const db=e.target.result;
    if(!db.objectStoreNames.contains('audio'))db.createObjectStore('audio');
    if(!db.objectStoreNames.contains('korr'))db.createObjectStore('korr'); };
  r.onsuccess=e=>{fertig=true;res(e.target.result);};
  r.onerror=()=>{fertig=true;res(null);};
  r.onblocked=()=>{ zeigeFehler('<b>Bitte andere Tabs dieser Seite schließen.</b>'); };
  setTimeout(()=>{ if(!fertig)res(null); },6000);
});}
function put(s,k,v){ return new Promise(r=>{ if(!DB)return r();
  try{const t=DB.transaction(s,'readwrite');t.objectStore(s).put(v,k);t.oncomplete=r;t.onerror=r;}catch(e){r();} }); }
function hole(s,k){ return new Promise(r=>{ if(!DB)return r(undefined);
  try{const q=DB.transaction(s,'readonly').objectStore(s).get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(undefined);}catch(e){r(undefined);} }); }
function entferne(s,k){ return new Promise(r=>{ if(!DB)return r();
  try{const t=DB.transaction(s,'readwrite');t.objectStore(s).delete(k);t.oncomplete=r;t.onerror=r;}catch(e){r();} }); }
function alleKeys(s){ return new Promise(r=>{ if(!DB)return r([]);
  try{const q=DB.transaction(s,'readonly').objectStore(s).getAllKeys();q.onsuccess=()=>r(q.result||[]);q.onerror=()=>r([]);}catch(e){r([]);} }); }

/* ====================== Supabase ====================== */
async function sb(pfad,opt){ opt=opt||{};
  const r=await fetch(CONFIG.SUPABASE_URL+'/rest/v1/'+pfad,{...opt,headers:{
    apikey:CONFIG.SUPABASE_KEY, Authorization:'Bearer '+CONFIG.SUPABASE_KEY,
    'Content-Type':'application/json', ...(opt.headers||{})}});
  if(!r.ok)throw new Error(r.status+' '+(await r.text()).slice(0,120));
  const t=await r.text(); return t?JSON.parse(t):null; }

async function zentralLaden(){ if(!ONLINE)return 0;
  try{ const rows=await sb('korrekturen?select=*&limit=100000',{headers:{Prefer:'return=representation'}});
    let n=0; (rows||[]).forEach(r=>{ const l=korr[r.eintrag_id];
      if(!l||!l._zeit||new Date(r.geaendert_am)>new Date(l._zeit)){
        korr[r.eintrag_id]={de:r.de||undefined,so:r.so||undefined,ymm:r.ymm||undefined,
          urteil:r.urteil||undefined,notiz:r.notiz||undefined,_zeit:r.geaendert_am,_wer:r.bearbeiter}; n++; }});
    await put('korr','alle',korr); return n; }catch(e){ console.warn(e.message); return 0; } }

async function zentralSpeichern(id){ if(!ONLINE)return; const p=korr[id]||{};
  try{ await sb('korrekturen',{method:'POST',headers:{Prefer:'resolution=merge-duplicates'},
    body:JSON.stringify([{eintrag_id:id,de:p.de??null,so:p.so??null,ymm:p.ymm??null,
      urteil:p.urteil??null,notiz:p.notiz??null,bearbeiter:ICH||'unbekannt',team_code:CONFIG.TEAM_CODE}])});
    zeigeSync('✓ gespeichert'); }catch(e){ zeigeSync('nur lokal'); } }

async function positionMerken(){ if(!ONLINE||!ICH)return;
  try{ await sb('fortschritt',{method:'POST',headers:{Prefer:'resolution=merge-duplicates'},
    body:JSON.stringify([{bearbeiter:ICH,kategorie:kat,position:idx,team_code:CONFIG.TEAM_CODE}])}); }catch(e){} }
async function positionHolen(){ if(!ONLINE||!ICH)return null;
  try{ const r=await sb('fortschritt?bearbeiter=eq.'+encodeURIComponent(ICH)+'&select=*',
    {headers:{Prefer:'return=representation'}}); return r&&r[0]?r[0]:null; }catch(e){ return null; } }

async function audioHoch(key,blob){ if(!ONLINE)return null;
  const pfad=key.replace(/:/g,'_')+'.webm';
  try{ const r=await fetch(CONFIG.SUPABASE_URL+'/storage/v1/object/aufnahmen/'+pfad,{method:'POST',
      headers:{apikey:CONFIG.SUPABASE_KEY,Authorization:'Bearer '+CONFIG.SUPABASE_KEY,
        'Content-Type':'audio/webm','x-upsert':'true'},body:blob});
    if(!r.ok)throw new Error('upload');
    const t=key.split(':');
    await sb('aufnahmen',{method:'POST',headers:{Prefer:'resolution=merge-duplicates'},
      body:JSON.stringify([{eintrag_id:t[1],varietaet:t[2],pfad,sprecher:ICH||'unbekannt',
        bytes:blob.size,team_code:CONFIG.TEAM_CODE}])});
    return pfad; }catch(e){ return null; } }
async function zentraleAudiosLaden(){ if(!ONLINE)return;
  try{ const r=await sb('aufnahmen?select=eintrag_id,varietaet,pfad,sprecher',{headers:{Prefer:'return=representation'}});
    zentraleAudios=new Map((r||[]).map(a=>['audio:'+a.eintrag_id+':'+a.varietaet,a])); }catch(e){} }
function audioUrl(k){ const a=zentraleAudios.get(k);
  return a?CONFIG.SUPABASE_URL+'/storage/v1/object/public/aufnahmen/'+a.pfad:null; }

/* ====================== Vorlesen / Aufnahme ====================== */
function sprich(t){ if(!('speechSynthesis' in window))return; speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t); u.lang='de-DE'; u.rate=.85; speechSynthesis.speak(u); }

async function starteAufnahme(key,bid){
  try{ const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    const mr=new MediaRecorder(stream); const chunks=[];
    mr.ondataavailable=e=>{ if(e.data.size)chunks.push(e.data); };
    mr.onstop=async()=>{ stream.getTracks().forEach(t=>t.stop());
      const blob=new Blob(chunks,{type:mr.mimeType||'audio/webm'});
      await put('audio',key,blob); rec[key]=null; await zeichne();
      const p=await audioHoch(key,blob);
      if(p){ await zentraleAudiosLaden(); zeigeSync('☁ hochgeladen'); zeichne(); } };
    mr.start(); rec[key]={mr,start:Date.now()}; await zeichne();
    const el=$(bid);
    rec[key].timer=setInterval(()=>{ if(el&&rec[key])
      el.textContent='⏹ Stopp · '+Math.floor((Date.now()-rec[key].start)/1000)+'s'; },400);
  }catch(e){ zeigeFehler('<b>Kein Mikrofonzugriff.</b> Bitte im Browser erlauben (Schloss-Symbol in der Adresszeile).'); } }
function stoppeAufnahme(k){ if(rec[k]){ clearInterval(rec[k].timer); rec[k].mr.stop(); } }
async function spieleAb(k){ const b=await hole('audio',k);
  if(b){ new Audio(URL.createObjectURL(b)).play(); return; }
  const u=audioUrl(k); if(u)new Audio(u).play(); }
async function ladeRunter(k,wort){ let b=await hole('audio',k);
  if(!b){ const u=audioUrl(k); if(!u)return; b=await (await fetch(u)).blob(); }
  const a=document.createElement('a'); a.href=URL.createObjectURL(b);
  a.download=k.replace(/:/g,'_')+'_'+String(wort||'').replace(/[^\wäöüßÄÖÜ-]/g,'').slice(0,28)+'.webm'; a.click(); }
async function loescheAudio(k){ await entferne('audio',k); zeichne(); }

/* ====================== Korrekturen ====================== */
let tL,tZ;
function setze(id,feld,wert){ korr[id]=korr[id]||{}; korr[id][feld]=wert;
  korr[id]._zeit=new Date().toISOString(); korr[id]._wer=ICH;
  clearTimeout(tL); tL=setTimeout(()=>put('korr','alle',korr),400);
  clearTimeout(tZ); tZ=setTimeout(()=>zentralSpeichern(id),1400); }
async function urteil(id,wert){ setze(id,'urteil',wert); await put('korr','alle',korr); zentralSpeichern(id);
  const k=$('karte'); if(k&&wert==='ok'){ k.classList.add('gut'); setTimeout(()=>k.classList.remove('gut'),700); }
  const l=liste(); if(idx<l.length-1)idx++; positionMerken(); zeichne(); }

/* ====================== Liste ====================== */
function liste(){ let l = kat==='alle'?DATEN:DATEN.filter(d=>d.k===kat);
  if(nurOffen)l=l.filter(d=>!(korr[d.i]||{}).urteil);
  if(suche){ const s=suche.toLowerCase();
    l=l.filter(d=>((d.de||'')+(d.en||'')+(d.so||'')+(d.ymm||'')).toLowerCase().includes(s)); }
  return l; }

/* ====================== Zeichnen ====================== */
async function zeichne(){
  lokaleAudios=new Set(await alleKeys('audio'));
  const l=liste(); if(idx>=l.length)idx=Math.max(0,l.length-1);
  const e=l[idx];
  const fertig=Object.values(korr).filter(p=>p&&p.urteil).length;
  const ges=DATEN.length||1;
  $('fortschritt').textContent=fertig.toLocaleString('de')+' / '+DATEN.length.toLocaleString('de')+' geprüft';
  $('balken').style.width=Math.min(100,fertig/ges*100)+'%';
  $('mitAudio').textContent=new Set([...lokaleAudios,...zentraleAudios.keys()]).size;

  const karte=$('karte');
  if(!e){ karte.innerHTML='<p class="leer">Nichts gefunden.</p>'; return; }
  const p=korr[e.i]||{};
  const kSo='audio:'+e.i+':so', kYmm='audio:'+e.i+':ymm';
  const soW=p.so!==undefined?p.so:(e.so||'');
  const ymmW=p.ymm!==undefined?p.ymm:(e.ymm||'');
  const deW=p.de!==undefined?p.de:(e.de||'');
  const lang=(e.so||'').length>60;

  karte.innerHTML=
   '<div class="kopfzeile"><span class="zaehler">'+(idx+1).toLocaleString('de')+' VON '+l.length.toLocaleString('de')+'</span><span>'+
     (e.u?'<span class="warn">unsicher</span> ':'')+
     (p._wer&&p._wer!==ICH?'<span class="wer">'+esc(p._wer)+'</span>':'')+'</span></div>'+
   '<div class="dezeile"><div style="flex:1;min-width:0">'+
     (deW?'<div class="de">'+esc(deW)+'</div>'+(e.pl?'<div class="pl">Plural: '+esc(e.pl)+'</div>':'')
        :'<div class="fehlt">Deutsche Übersetzung fehlt</div>')+
     (e.en?'<div class="en"><b>EN</b>'+esc(e.en)+'</div>':'')+
   '</div>'+
   (deW?'<button class="rund" onclick="sprich('+JSON.stringify(deW+(e.pl?', '+e.pl:''))+')">🔊</button>':'')+
   '</div>'+
   (!e.de?'<input class="feld anmerkung" placeholder="Deutsche Übersetzung eintragen" value="'+esc(p.de)+'" oninput="setze(\''+e.i+'\',\'de\',this.value)">':'')+
   (e.n?'<div class="notiz">'+esc(e.n)+'</div>':'')+
   '<div class="block gruen"><div class="blabel"><span class="punkt"></span>Af-Maxaa · Nord / Somaliland</div>'+
     (lang?'<textarea class="feld gross" rows="3" oninput="setze(\''+e.i+'\',\'so\',this.value)">'+esc(soW)+'</textarea>'
          :'<input class="feld gross" value="'+esc(soW)+'" oninput="setze(\''+e.i+'\',\'so\',this.value)">')+
     audioZeile(kSo,soW,'Af-Maxaa','gruen')+'</div>'+
   '<div class="block amber"><div class="blabel"><span class="punkt"></span>Af-Maay · Süd</div>'+
     (lang?'<textarea class="feld gross" rows="3" placeholder="Af-Maay eintragen" oninput="setze(\''+e.i+'\',\'ymm\',this.value)">'+esc(ymmW)+'</textarea>'
          :'<input class="feld gross" placeholder="Af-Maay eintragen" value="'+esc(ymmW)+'" oninput="setze(\''+e.i+'\',\'ymm\',this.value)">')+
     audioZeile(kYmm,ymmW,'Af-Maay','amber')+'</div>'+
   '<textarea class="feld anmerkung" rows="2" placeholder="Anmerkung" oninput="setze(\''+e.i+'\',\'notiz\',this.value)">'+esc(p.notiz)+'</textarea>'+
   '<div class="urteile">'+
     '<button class="'+(p.urteil==='ok'?'aktiv ok':'')+'" onclick="urteil(\''+e.i+'\',\'ok\')">✓ richtig</button>'+
     '<button class="'+(p.urteil==='falsch'?'aktiv falsch':'')+'" onclick="urteil(\''+e.i+'\',\'falsch\')">✗ falsch</button>'+
     '<button class="'+(p.urteil==='unklar'?'aktiv unklar':'')+'" onclick="urteil(\''+e.i+'\',\'unklar\')">? unklar</button></div>';

  $('zurueck').disabled=idx===0;
  $('weiter').disabled=idx>=l.length-1;
}

function audioZeile(key,wort,label,farbe){
  const hat=lokaleAudios.has(key)||zentraleAudios.has(key);
  const nurZ=zentraleAudios.has(key)&&!lokaleAudios.has(key);
  const bid='btn_'+key.replace(/:/g,'_');
  if(rec[key])return '<div class="audio"><button id="'+bid+'" class="rot" onclick="stoppeAufnahme(\''+key+'\')">⏹ Stopp · 0s</button><span class="pulsi">● Aufnahme läuft</span></div>';
  return '<div class="audio"><button class="'+farbe+'" onclick="starteAufnahme(\''+key+'\',\''+bid+'\')">🎙 '+
    (hat?'Neu aufnehmen':label+' aufnehmen')+'</button>'+
    (hat?'<button onclick="spieleAb(\''+key+'\')">▶ Anhören'+(nurZ?' ☁':'')+'</button>'+
         '<button onclick="ladeRunter(\''+key+'\','+JSON.stringify(String(wort||''))+')">⤓ Datei</button>'+
         (lokaleAudios.has(key)?'<button class="loesch" onclick="loescheAudio(\''+key+'\')">löschen</button>':'')
        :'')+'</div>'; }

/* ====================== Statistik ====================== */
function zeigeStatistik(){
  const el=$('statistik');
  if(el.style.display==='block'){ el.style.display='none'; return; }
  const werte=Object.values(korr).filter(p=>p&&p.urteil);
  const proPerson={};
  Object.values(korr).forEach(p=>{ if(p&&p.urteil){ const w=p._wer||'unbekannt'; proPerson[w]=(proPerson[w]||0)+1; } });
  const rang=Object.entries(proPerson).sort((a,b)=>b[1]-a[1]);
  const mitYmm=Object.values(korr).filter(p=>p&&p.ymm).length;
  const audios=new Set([...lokaleAudios,...zentraleAudios.keys()]).size;
  el.style.display='block';
  el.innerHTML='<h3>Statistik</h3><div class="statgrid">'+
    kachel(werte.length,'geprüft')+
    kachel(werte.filter(p=>p.urteil==='ok').length,'richtig')+
    kachel(werte.filter(p=>p.urteil==='falsch').length,'falsch')+
    kachel(mitYmm,'Af-Maay')+
    kachel(audios,'Aufnahmen')+
    kachel(DATEN.length,'gesamt')+
    '</div>'+
    (rang.length?'<div class="rangliste">'+rang.map((r,i)=>
      '<div class="rang'+(r[0]===ICH?' ich':'')+'"><span class="pos">'+(i+1)+'</span>'+
      '<span class="nm">'+esc(r[0])+'</span><span class="ct">'+r[1].toLocaleString('de')+'</span></div>').join('')+'</div>'
     :'<p style="color:var(--tinte3);margin:0">Noch nichts geprüft.</p>')+
    (ONLINE?'':'<p style="font-size:13px;color:var(--tinte3);margin:14px 0 0">Ohne Server sieht jeder nur die eigene Arbeit. Siehe supabase-schema.sql.</p>');
}
function kachel(z,l){ return '<div class="statkachel"><div class="z">'+Number(z).toLocaleString('de')+'</div><div class="l">'+l+'</div></div>'; }

/* ====================== Export ====================== */
function exportJSON(){ const rein={};
  for(const k in korr){ const o=Object.assign({},korr[k]); delete o._zeit; delete o._wer;
    if(Object.keys(o).length)rein[k]=o; }
  const b=new Blob([JSON.stringify({bearbeiter:ICH,stand:new Date().toISOString(),daten:rein},null,1)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(b);
  a.download='lingo-check-'+(ICH||'export')+'-'+new Date().toISOString().slice(0,10)+'.json'; a.click(); }
async function importJSON(ev){ const f=ev.target.files[0]; if(!f)return;
  try{ const j=JSON.parse(await f.text()); const neu=j.daten||j; const wer=j.bearbeiter||'Import'; let n=0;
    for(const k in neu){ korr[k]=Object.assign({},korr[k],neu[k],{_zeit:new Date().toISOString(),_wer:wer}); n++; }
    await put('korr','alle',korr);
    if(ONLINE)for(const k in neu)await zentralSpeichern(k);
    zeigeSync(n+' übernommen',3000); zeichne();
  }catch(e){ zeigeFehler('Datei konnte nicht gelesen werden.'); }
  ev.target.value=''; }
async function alleAudios(){ const keys=[...new Set([...lokaleAudios,...zentraleAudios.keys()])];
  if(!keys.length){ zeigeFehler('Noch keine Aufnahmen vorhanden.'); return; }
  if(!confirm(keys.length+' Aufnahmen herunterladen?'))return;
  for(const k of keys){ const e=DATEN.find(d=>k.indexOf('audio:'+d.i+':')===0);
    await ladeRunter(k,e?(k.slice(-3)===':so'?e.so:e.ymm):''); await new Promise(r=>setTimeout(r,250)); } }

/* ====================== Filter / Laden ====================== */
const NAMEN={behoerde:'Behörde',nordsued:'Nord/Süd',begruessung:'Begrüßung',zahlen:'Zahlen',
 zahlen_alle:'Zahlen 0–100.000',alphabet:'Alphabet',zeit:'Zeit',gesundheit:'Gesundheit',
 familie:'Familie',weg:'Weg',arbeit:'Arbeit',thema_tiere:'Tiere',thema_essen:'Essen',
 thema_getraenke:'Getränke',thema_farben:'Farben',thema_koerper:'Körper',thema_kleidung:'Kleidung',
 thema_haus:'Haus',thema_natur:'Natur',thema_verkehr:'Verkehr',thema_alltag:'Alltag',
 thema_verben:'Verben (Themen)',substantive:'Substantive',verben:'Verben',adjektive:'Adjektive',
 zahlwoerter:'Zahlwörter',pronomen:'Pronomen',adverbien:'Adverbien',praepositionen:'Präpositionen',
 konjunktionen:'Konjunktionen',partikeln:'Partikeln',artikelwoerter:'Artikelwörter',
 interjektionen:'Interjektionen',suffixe:'Suffixe',eigennamen:'Eigennamen',buchstaben:'Buchstaben',
 saetze:'Sätze',korpus_saetze:'Korpus-Sätze',korpus_woerter:'Korpus-Wörter',sonstige:'Sonstige'};
const ORD=['behoerde','nordsued','begruessung','alphabet','zahlen','zahlen_alle','zeit',
 'thema_tiere','thema_essen','thema_getraenke','thema_farben','thema_koerper','thema_kleidung',
 'thema_haus','thema_natur','thema_verkehr','thema_alltag','thema_verben',
 'gesundheit','familie','weg','arbeit','substantive','verben','adjektive','saetze',
 'korpus_saetze','korpus_woerter','zahlwoerter','pronomen','adverbien','praepositionen',
 'konjunktionen','partikeln','artikelwoerter','interjektionen','suffixe','eigennamen',
 'buchstaben','sonstige'];

function baueFilter(){ const z={}; DATEN.forEach(d=>z[d.k]=(z[d.k]||0)+1);
  $('filter').innerHTML='<button onclick="setKat(\'alle\')" id="k_alle">Alle ('+DATEN.length.toLocaleString('de')+')</button>'+
    ORD.filter(x=>z[x]).map(x=>'<button onclick="setKat(\''+x+'\')" id="k_'+x+'">'+(NAMEN[x]||x)+' ('+z[x].toLocaleString('de')+')</button>').join('');
  const b=$('k_'+kat); if(b)b.classList.add('aktiv'); }

async function ladeBlock(n){ if(geladen.has(n))return;
  const r=await fetch('daten'+n+'.json?v=3'); if(!r.ok)throw new Error('daten'+n+'.json HTTP '+r.status);
  DATEN=DATEN.concat(await r.json()); geladen.add(n); }
async function ladeRest(){ const info=$('ladeinfo');
  for(let n=1;n<VERZ.bloecke;n++){ try{ await ladeBlock(n); }catch(e){ console.warn(e.message); }
    if(info)info.textContent=DATEN.length.toLocaleString('de')+' von '+VERZ.gesamt.toLocaleString('de')+' geladen …'; }
  if(info)info.textContent=''; baueFilter(); zeichne(); }

function setKat(k){ kat=k; idx=0;
  document.querySelectorAll('#filter button').forEach(b=>b.classList.remove('aktiv'));
  const b=$('k_'+k); if(b){ b.classList.add('aktiv'); b.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'}); }
  positionMerken(); zeichne(); }
function toggleOffen(){ nurOffen=!nurOffen; idx=0; $('offenBtn').classList.toggle('aktiv',nurOffen); zeichne(); }
function suchen(v){ suche=v; idx=0; zeichne(); }
function blaettern(n){ const l=liste(); idx=Math.max(0,Math.min(l.length-1,idx+n)); positionMerken(); zeichne(); }

/* ====================== Start ====================== */
async function starten(){
  try{
    DB=await oeffneDB();
    if(!DB)zeigeFehler('<b>Lokaler Speicher nicht verfügbar.</b> Privates Fenster? Dann normal öffnen.');
    korr=(await hole('korr','alle'))||{};
    ONLINE=!!(CONFIG.SUPABASE_URL&&CONFIG.SUPABASE_KEY);
    const s=$('sync'); s.textContent=ONLINE?'☁ verbunden':'○ dieses Gerät'; s.classList.toggle('online',ONLINE);

    const rv=await fetch('verzeichnis.json?v=3');
    if(!rv.ok)throw new Error('verzeichnis.json HTTP '+rv.status);
    VERZ=await rv.json();

    await ladeBlock(0); baueFilter(); setKat('behoerde'); await zeichne();

    if(ONLINE){ const n=await zentralLaden(); await zentraleAudiosLaden();
      if(n)zeigeSync('☁ '+n+' geholt',3000);
      const pos=await positionHolen();
      if(pos&&pos.kategorie){ kat=pos.kategorie; idx=pos.position||0; setKat(kat); }
      zeichne(); }
    ladeRest();
  }catch(err){
    zeigeFehler('<b>Fehler beim Laden:</b> '+err.message+'<br>Bitte mit Strg+F5 neu laden.');
    $('karte').innerHTML='<p class="leer">Konnte nicht geladen werden.</p>';
  }
}

function init(){
  if(ICH){ $('tor').style.display='none'; $('ichPille').textContent='👤 '+ICH; starten(); }
  else { $('namefeld').focus(); }
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init); else init();
</script>
